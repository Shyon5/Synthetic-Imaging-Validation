name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Base tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,viz]"

      - name: Verify plotting dependency
        run: python -c "import matplotlib"

      - name: Run base tests with coverage
        run: python -m pytest -m "not torch" --cov --cov-report=term-missing --cov-fail-under=100

  numpy1-compatibility:
    name: NumPy 1.26 compatibility (Ubuntu, Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints/numpy1.txt

      - name: Install package and optional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c ".github/constraints/numpy1.txt" -e ".[test,viz]"

      - name: Run base tests with coverage
        run: python -m pytest -m "not torch" --cov --cov-report=term-missing --cov-fail-under=100

  torchmetrics-parity:
    name: TorchMetrics parity (Ubuntu, Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and CPU-only reference backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2,<3.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,torch,viz]"

      - name: Verify reference dependencies
        run: python -c "import torch, torchmetrics"

      - name: Run complete suite and backend parity checks
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=100

  all-tests:
    name: Test suite
    if: always()
    needs: [core, numpy1-compatibility, torchmetrics-parity]
    runs-on: ubuntu-latest

    steps:
      - name: Check matrix results
        shell: bash
        run: |
          test "${{ needs.core.result }}" = "success"
          test "${{ needs.numpy1-compatibility.result }}" = "success"
          test "${{ needs.torchmetrics-parity.result }}" = "success"
